name: grf
label: GRF
description: The NiSpace "GRF" dataset consists of Gaussian Random Field Maps (GRFs) generated with varying spatial smoothness.
  The parameter "alpha" controls the smoothness of the field and therefore the spatial autocorrelation of the resulting brain
  maps. The maps are mirrored across hemispheres exactly at MNI coordinate (0,0,0). There are 10,000 maps for each of the
  four smoothness levels (alpha=0, 1, 2, 3; alpha=0 being spatially unstructured white noise).
  The code was adopted from Markello et al., 2021 and Burt et al., 2020.
default_collection: ByAlpha
cortex_only: false
citations:
- ref: Markello et al., 2021
  doi: 10.1016/j.neuroimage.2021.118052
- ref: Burt et al., 2020
  doi: 10.1016/j.neuroimage.2020.117038
collections:
  All:
    description: 40000 Gaussian random fields (10k per smoothness level; alpha=0, 1, 2, 3).
  Alpha0:
    description: 10000 spatially unstructured (white noise) GRFs (alpha=0).
  ByAlpha:
    description: All 40000 GRFs grouped by smoothness parameter (alpha).
  ByAlpha1000:
    description: 1000 GRFs for each smoothness level alpha, grouped by alpha.
tabs: auto
