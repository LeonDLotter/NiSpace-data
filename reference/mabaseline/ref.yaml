name: mabaseline
label: MABaseline
description: The NiSpace "MABaseline" dataset contains meta-analytic "reporting baseline" maps as introduced with the C-SALE
  method (Magielse et al., 2025). Each map is the voxel-wise density of activation foci reported across a coordinate-based
  meta-analysis database or a subset of it, i.e., every focus convolved with an ALE kernel for a fixed sample size of n=20,
  then summed. Values are unnormalized. NiSpace uses these maps as sampling priors for coordinate-based (NiMARE) null maps, with
  null foci drawn with probability proportional to the map value; the relative voxel values therefore are the model and are
  not rescaled in any space. Fetch the original maps by requesting space="MNIOriginal" (downloaded unchanged from the source
  repository, https://github.com/CNG-LAB/cerebellum_specific_ALE). The processed maps are downloaded from the NiSpace-data
  GitHub repo; the original maps are on the MNI152NLin6Asym 2mm grid and were masked to the template brain mask, transformed
  to MNI152NLin2009cAsym with a pre-estimated MNI-to-MNI transformation, and to fsLR/fsaverage using neuromaps.
cortex_only: false
