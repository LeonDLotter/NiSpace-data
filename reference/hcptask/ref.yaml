name: hcptask
label: HCPTask
description: HCP S1200 group-average task-fMRI maps (Cohen's d; 997 subjects; MSMAll, 2mm smoothing) from BALSA (reference pkXDZ);
  47 conditions and contrasts (HCP's 39 sign-flipped duplicates omitted). Map images are cortical
  (fsLR, fsaverage); subcortical data (incl. cerebellum, brainstem) is only available as parcellated tables
  for subcortical parcellations. The "Canonical" collection selects the key contrasts from each task
  (Barch et al., 2013). Cite the original HCP papers and include the HCP acknowledgment if you use the
  maps in any publication (see HCP Open Access Data Use Terms).
default_set_collection: All-Sets
cortex_only: false
license: HCP Open Access Data Use Terms
citations:
- ref: Barch et al., 2013
  doi: 10.1016/j.neuroimage.2013.05.033
- ref: Van Essen et al., 2013
  doi: 10.1016/j.neuroimage.2013.05.041
- ref: Glasser et al., 2013
  doi: 10.1016/j.neuroimage.2013.04.127
map_info:
  cite_column: doi
  display_columns:
  - task
  - label
  - type
collections:
  All:
    description: All 47 HCP task-fMRI maps (conditions vs. baseline and contrasts).
  Canonical:
    description: The focused contrast of each task (Barch et al., 2013), e.g., 2-back vs. 0-back; for the motor task,
      each movement vs. the average of all movements (11 maps).
  Conditions:
    description: All task conditions vs. baseline (31 maps).
  Contrasts:
    description: All contrasts between task conditions (16 maps).
  All-Sets:
    description: All maps in 7 sets, one per task (WorkingMemory, Gambling, Motor, Language, Social, Relational,
      Emotion), for set enrichment. Unweighted.
tabs: auto
