  ASDModulesGandal2022:
    description: Gene co-expression modules significantly dysregulated in ASD cortex. Naming -
      GeneM3_up_cortex = gene module 3, significantly upregulated on cortex-level;
      GeneM4_down_region = gene module 4, significantly downregulated in at least one region.
      Modules have labels assigned in the source publication, or retroactively by us. GeneM9
      ("neural noncoding") is excluded - almost all of its non-coding member genes are dropped by
      nispace's reproducibility-based gene filtering, so the remnant no longer represents the module.
    citations:
    - ref: Gandal et al., 2022
      doi: 10.1038/s41586-022-05377-7
  ASDModulesGandal2022Weights:
    description: Same gene sets as ASDModulesGandal2022, weighted by each gene's kME (module
      eigengene correlation / intramodular connectivity) to its own assigned module, so
      membership strength can be used as a continuous weight instead of binary in/out.
    citations:
    - ref: Gandal et al., 2022
      doi: 10.1038/s41586-022-05377-7
  FMR1Targets:
    description: FMR1/FMRP-related gene sets, 3 evidence types encoded in the set name -
      FMR1Target (CLIP-seq binding targets), ASDEditMod (RNA-editing co-module linked to ASD
      diagnosis), FXSEditDiff (differential RNA editing in Fragile-X-spectrum patients).
      Naming - {EvidenceType}_{Context}_{Study}, e.g. FMR1Target_dNPC_Li2020. Note - NonNeuronal
      = HEK293 cells, MouseBrain = mouse not human; UCDavisFXTAS is premutation FXTAS, not
      full-mutation FXS.
