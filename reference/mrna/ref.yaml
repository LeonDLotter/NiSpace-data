    description: Same 21 disorders as GWASAtlas, including the 4 with zero genome-wide-significant
      genes, weighted by -log10(MAGMA gene-based p-value). This reflects statistical confidence in
      gene-disorder association, not a direct effect-size estimate - valid for thresholding
      uniformly across all disorders (recovering GWASAtlas is weight > 5.606), not for
