  ProteinAtlas:
    description: Human Protein Atlas RNA tissue specificity categories (HPA v25.1). Categories
      taken directly from HPA - ElevatedInBrain (in brain > other tissue), NotElevatedInBrain
      (deteced in brain but elevated elsewhere), LowSpecificityInBrain (broadly expressed, incl brain),
      NotInBrain (detected somewhere but not in brain), NotInTissue (not detected in any tissue). 
      Combined categories for practical gene filtering - ExpressedInBrain (union of ElevatedInBrain,
      NotElevatedInBrain, LowSpecificityInBrain), NotExpressedInBrain (union of NotInBrain, NotInTissue).
    citations:
