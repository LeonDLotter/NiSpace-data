      doi: 10.1093/genetics/iyad031
    - ref: Subramanian et al., 2005
      doi: 10.1073/pnas.0506580102
  CorticalLayers:
    description: Layer-enriched marker genes for cortical layers 1–6.
    citations:
    - ref: Wagstyl et al., 2024
      doi: 10.7554/eLife.86933.2
    - ref: He et al., 2017
      doi: 10.1038/nn.4548
    - ref: Maynard et al., 2021
