name: magicc
label: MAGICC
description: The NiSpace "MAGICC" dataset contains cortical gene expression maps for > 10,000 genes based on a continuous reconstruction.
  The dataset consists of Allen Brain Atlas mRNA expression data from postmortem brain tissue of six donors (Hawrylycz et al., 2012), 
  mapped onto continuous fsLR space as described in Wagstyl et al., 2024, and parcellated with integrated parcellation. 
  Only genes that showed a high reproducibility (>= 0.5, see paper) were retained. 
  Please cite the source publications, as well as publications associated with gene set collections as appropriate.
default_collection: CellTypesPsychEncodeTPM
cortex_only: true
citations:
- ref: Hawrylycz et al., 2012
  doi: 10.1038/nature11405
- ref: Wagstyl et al., 2024
  doi: 10.7554/eLife.86933.1
collections:
  All:
    description: All brain-expressed genes passing MAGICC reproducibility threshold (r ≥ 0.5).
  CellTypesPsychEncodeTPM:
    description: Cell-type marker genes from PsychENCODE single-cell data (TPM-normalized).
    citations:
    - ref: Lake et al., 2016
      doi: 10.1126/science.aaf1204
    - ref: Darmanis et al., 2015
      doi: 10.1073/pnas.1507125112
    - ref: Wang et al., 2018
      doi: 10.1126/science.aat8464
  CellTypesPsychEncodeUMI:
    description: Cell-type marker genes from PsychENCODE single-cell data (UMI counts).
    citations:
    - ref: Lake et al., 2018
      doi: 10.1038/nbt.4038
    - ref: Wang et al., 2018
      doi: 10.1126/science.aat8464
  CellTypesSilettiClusters:
    description: Cell-type cluster marker genes (Siletti et al., 2023 single-nucleus RNA-seq).
    citations:
    - ref: Siletti et al., 2023
      doi: 10.1126/science.add7046
  CellTypesSilettiSuperclusters:
    description: Cell-type supercluster marker genes (Siletti et al., 2023).
    citations:
    - ref: Siletti et al., 2023
      doi: 10.1126/science.add7046
  Chromosome:
